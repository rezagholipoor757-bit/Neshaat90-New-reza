name: Build Neshaat90 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/ir/neshaat90/app
          mkdir -p app/src/main/assets
          cp MainActivity.java app/src/main/java/ir/neshaat90/app/
          cp AndroidManifest.xml app/src/main/
          cp index.html app/src/main/assets/

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'ir.neshaat90.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'ir.neshaat90.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Neshaat90-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
