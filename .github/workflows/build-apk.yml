
name: Neshaat90 - Side-by-side Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'neshaat90-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: neshaat90-v3-debug-signing-key-v1

      - name: Extract Android project
        run: unzip -q -o neshaat90-source.zip -d .

      - name: Verify source application ID
        working-directory: Neshaat90_Android_Project
        run: grep -F "applicationId 'ir.neshaat90.app.v3'" app/build.gradle

      - name: Clean and build APK
        working-directory: Neshaat90_Android_Project
        run: gradle --no-daemon clean assembleDebug

      - name: Verify built APK package ID
        working-directory: Neshaat90_Android_Project
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "package: name='ir.neshaat90.app.v3'" /tmp/apk-badging.txt
          mkdir -p ../verified-output
          cp "$APK" ../verified-output/Neshaat90-v3.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Neshaat90-v3-APK-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-output/Neshaat90-v3.apk
          if-no-files-found: error
          retention-days: 7
