<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>نشاط ۹۰</title>
<style>
:root{--g:#087b46;--bg:#f3f6f4;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:#18251e}
header{background:var(--g);color:white;padding:16px;text-align:center;font-size:20px;font-weight:bold}
main{padding:12px;max-width:760px;margin:auto}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:80px}
label{font-size:13px;color:#4a5b50}input,select,button{font:inherit;border:1px solid #ccd8d0;border-radius:8px;padding:10px;background:white;min-width:0}
input[type=number]{width:100%}button{background:var(--g);color:white;border:0;font-weight:bold}button.secondary{background:#e8f1eb;color:#155b38}button.danger{background:#a52b2b}
.games{display:grid;gap:8px}.game{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px}.gamehead{display:grid;grid-template-columns:1fr 1fr;gap:8px}.picks{display:flex;gap:8px;margin-top:8px}.pick{flex:1;text-align:center;border:1px solid #cbd8cf;border-radius:8px;padding:9px}.pick input{display:none}.pick:has(input:checked){background:#183b2b;color:white;border-color:#183b2b}
.small{font-size:12px;color:#637268}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#edf5ef;padding:8px 10px;border-radius:8px;flex:1;text-align:center}.ticket{border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.ticket b{color:var(--g)}.hidden{display:none}
</style></head><body><header>نشاط ۹۰ | تولید فرم پیش‌بینی</header><main>
<section class="panel">
<div class="row"><div><label>تعداد مسابقات</label><select id="n"></select></div><div><label>تعداد فرم (حداکثر ۳۰۰)</label><input id="count" type="number" min="1" max="300" value="100"></div></div>
<div class="row" style="margin-top:8px"><div><label>فرم تک‌تیک</label><input id="singles" type="number" min="0" value="30"></div><div><label>فرم دوتیک</label><input id="doubles" type="number" min="0" value="50"></div><div><label>فرم سه‌تیک</label><input id="triples" type="number" min="0" value="20"></div></div>
<div class="small" style="margin-top:7px">جمع تک، دو و سه‌تیک باید برابر تعداد فرم‌ها باشد. هر فرم حداکثر ۳ انتخاب برای هر بازی دارد.</div>
</section>
<section class="panel"><div class="row"><b>مسابقات و انتخاب‌ها</b><button class="secondary" id="fill">پرکردن نام بازی‌ها</button></div><div id="games" class="games" style="margin-top:10px"></div></section>
<section class="panel"><b>تولید و کنترل فرم‌ها</b><div class="row" style="margin-top:10px"><button id="generate">تولید فرم‌ها</button><button id="regen" class="secondary">تولید مجدد</button></div><div class="stats" style="margin-top:10px"><div class="stat"><b id="made">۰</b><div class="small">فرم تولیدشده</div></div><div class="stat"><b id="dups">۰</b><div class="small">تکراری حذف‌شده</div></div><div class="stat"><b id="sum">۰</b><div class="small">مجموع مبلغ (ریال)</div></div></div><div id="msg" class="small" style="margin-top:8px"></div><div id="tickets"></div><button id="export" class="secondary" style="width:100%;margin-top:10px">خروجی CSV</button></section>
<section class="panel"><b>۱۸ سطح مبلغ</b><div class="row" id="amounts"></div><div class="small">مبالغ پیش‌فرض قابل ویرایش‌اند؛ پس از تعیین مقادیر دلخواه ذخیره می‌شوند.</div></section>
</main><script>
const fa=n=>Number(n).toLocaleString('fa-IR');let last=[];
const nsel=document.getElementById('n');for(let i=13;i<=20;i++){let o=document.createElement('option');o.value=i;o.textContent=i+' مسابقه';if(i===15)o.selected=true;nsel.append(o)}
function gameRows(){let n=+nsel.value,old=[...document.querySelectorAll('.game')].map(x=>({h:x.querySelector('.home').value,a:x.querySelector('.away').value,on:x.querySelector('.active').checked,p:[...x.querySelectorAll('.pick input')].map(z=>z.checked)}));let host=document.getElementById('games');host.innerHTML='';for(let i=0;i<n;i++){let v=old[i]||{};let d=document.createElement('div');d.className='game';d.innerHTML=`<div class="gamehead"><input class="home" placeholder="میزبان ${i+1}" value="${v.h||''}"><input class="away" placeholder="مهمان ${i+1}" value="${v.a||''}"></div><div class="row"><label><input class="active" type="checkbox" ${v.on===false?'':'checked'}> بازی فعال باشد</label></div><div class="picks">${['۱','X','۲'].map((x,j)=>`<label class="pick"><input type="checkbox" ${v.p?.[j]?'checked':''}> ${x}</label>`).join('')}</div>`;host.append(d)}}
nsel.onchange=gameRows;gameRows();
document.getElementById('fill').onclick=()=>{document.querySelectorAll('.game').forEach((g,i)=>{g.querySelector('.home').value='میزبان '+(i+1);g.querySelector('.away').value='مهمان '+(i+1)})};
const amountBox=document.getElementById('amounts');for(let i=1;i<=18;i++){let x=document.createElement('input');x.type='number';x.min=0;x.placeholder='سطح '+i;x.value=i*1000;x.style.width='100%';x.style.margin='3px';amountBox.append(x)}
function selected(){return [...document.querySelectorAll('.game')].map((g,i)=>({i,home:g.querySelector('.home').value||'میزبان '+(i+1),away:g.querySelector('.away').value||'مهمان '+(i+1),active:g.querySelector('.active').checked,p:[...g.querySelectorAll('.pick input')].map((x,j)=>x.checked?j:-1).filter(x=>x>=0)})).filter(x=>x.active)}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function generate(){let games=selected(),count=Math.max(1,Math.min(300,+document.getElementById('count').value||1)),s=+singles.value,d=+doubles.value,t=+triples.value;if(!games.length){msg.textContent='حداقل یک بازی فعال کنید.';return}if(s+d+t!==count){msg.textContent='جمع فرم‌های تک، دو و سه‌تیک باید دقیقاً برابر تعداد فرم‌ها باشد.';return}if(games.some(g=>!g.p.length)){msg.textContent='برای هر بازی فعال حداقل یک نتیجه انتخاب کنید.';return}let pool=games.map(g=>g.p),rows=new Map(),dups=0,tries=0;while(rows.size<count&&tries<count*1000){tries++;let kind=tries%3===1?'s':tries%3===2?'d':'t';let target=kind==='s'?s:kind==='d'?d:t;if([...rows.values()].filter(r=>r.kind===kind).length>=target)continue;let row=pool.map(p=>{let k=kind==='s'?1:kind==='d'?Math.min(2,p.length):Math.min(3,p.length);let a=[...p];for(let z=a.length-1;z>0;z--){let q=Math.floor(Math.random()*(z+1));[a[z],a[q]]=[a[q],a[z]]}return a.slice(0,k).sort().join('')});let key=row.join('|');if(rows.has(key)){dups++;continue}rows.set(key,{kind,row})}
last=[...rows.values()];made.textContent=fa(last.length);dupsEl.textContent=fa(dups);let vals=[...amountBox.querySelectorAll('input')].map(x=>+x.value||0),unit=vals[0]||0;sum.textContent=fa(last.length*unit);msg.textContent=last.length<count?'تولید به سقف ترکیب‌های یکتا رسید؛ تعداد فرم کمتر از درخواست است.':'فرم‌ها تولید شدند؛ ردیف تکراری در خروجی وجود ندارد.';tickets.innerHTML=last.map((r,i)=>`<div class="ticket"><b>${fa(i+1)}.</b> ${r.row.map((p,j)=>`${games[j]?.home||'بازی'}: ${p.split('').map(x=>['۱','X','۲'][+x]).join('/')}`).join(' | ')}</div>`).join('')}
const made=document.getElementById('made'),dupsEl=document.getElementById('dups'),msg=document.getElementById('msg'),tickets=document.getElementById('tickets'),sum=document.getElementById('sum'),singles=document.getElementById('singles'),doubles=document.getElementById('doubles'),triples=document.getElementById('triples');
document.getElementById('generate').onclick=generate;document.getElementById('regen').onclick=generate;
document.getElementById('export').onclick=()=>{if(!last.length)return;let csv='شماره,نوع,نتایج\n'+last.map((r,i)=>`${i+1},${r.kind},"${r.row.join(';')}"`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='Neshaat90.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
